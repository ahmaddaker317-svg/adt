name: Build ADT Stock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable release signing key
        env:
          ADT_KEYSTORE_BASE64: ${{ secrets.ADT_KEYSTORE_BASE64 }}
          ADT_STORE_PASSWORD: ${{ secrets.ADT_STORE_PASSWORD }}
          ADT_KEY_ALIAS: ${{ secrets.ADT_KEY_ALIAS }}
          ADT_KEY_PASSWORD: ${{ secrets.ADT_KEY_PASSWORD }}
        run: |
          test -n "$ADT_KEYSTORE_BASE64" && test -n "$ADT_STORE_PASSWORD" && test -n "$ADT_KEY_ALIAS" && test -n "$ADT_KEY_PASSWORD" || { echo 'Stable APK signing secrets are missing'; exit 1; }
          printf '%s' "$ADT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/adt-release.jks"
          echo "ADT_KEYSTORE_PATH=$RUNNER_TEMP/adt-release.jks" >> "$GITHUB_ENV"
          echo "ADT_STORE_PASSWORD=$ADT_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ADT_KEY_ALIAS=$ADT_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ADT_KEY_PASSWORD=$ADT_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        run: gradle :app:assembleRelease

      - name: Name release APK using the app version
        id: release
        run: |
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)"
          test -n "$version_name" || { echo 'Android versionName is missing'; exit 1; }
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk" || { echo 'Signed release APK is missing'; exit 1; }
          named_apk="app/build/outputs/apk/release/ADT-Stock-v${version_name}-Release.apk"
          mv "$source_apk" "$named_apk"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "apk_path=$named_apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADT-Stock-v${{ steps.release.outputs.version_name }}-Release-APK
          path: ${{ steps.release.outputs.apk_path }}
          if-no-files-found: error
